[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-kernel_env"
version = "0.1.0"
description = "AppSecEnv — Application Security Vulnerability Auto-Patcher for OpenEnv"
requires-python = ">=3.10"
dependencies = [
    "openenv-core[core]>=0.2.2",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
server = "kernel_env.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["kernel_env", "kernel_env.server"]
package-dir = { "kernel_env" = ".", "kernel_env.server" = "server" }